# Config for tinystories

# --- WandB ---
wandb_project: spd-lm
# wandb_project: null
# wandb_run_name: "test_run"
wandb_run_name: null
wandb_run_name_prefix: ""

# --- General ---
seed: 0
C: 300
n_mask_samples: 1
n_ci_mlp_neurons: 16
target_module_patterns: ["transformer.h.3.mlp.c_fc"]

# --- Loss Coefficients ---
# Weight faithfulness
# faithfulness_coeff: 30.0
faithfulness_coeff: 1e-8
# Regularisation 
faithfulness_scale: null

# Minimality
importance_minimality_coeff: 1e-2
# importance_minimality_coeff: 8e-3
pnorm: 2.0
schatten_coeff: null

# Reconstruction
recon_coeff: null
clamped_recon_coeff: 1
stochastic_recon_coeff: 1
recon_layerwise_coeff: null
stochastic_recon_layerwise_coeff: null
all_components_recon_coeff: 1
# embedding_recon_coeff: 1
embedding_recon_coeff: null
is_embed_unembed_recon: false
output_loss_type: kl


# --- Training ---
# batch_size: 4
batch_size: 2
steps: 50_000
lr: 1e-4
lr_schedule: constant
lr_warmup_pct: 0.07
lr_exponential_halflife: null
n_eval_steps: 100

# --- Logging & Saving ---
image_freq: 2000
image_on_first_step: true
print_freq: 1000
save_freq: null
log_ce_losses: true
noise_log_std: 0.2


# --- Pretrained model info ---
pretrained_model_class: transformers.AutoModelForCausalLM
pretrained_model_name_hf: roneneldan/TinyStories-1M
pretrained_model_output_attr: logits
preprocessor_name: EleutherAI/gpt-neo-125M

# --- Task Specific ---
task_config:
  task_name: lm
  max_seq_len: 64
  buffer_size: 1000
  dataset_name: "roneneldan/TinyStories"
  column_name: "text"
  # train_data_split: "train"
  # eval_data_split: "validation"
  train_data_split: "train[:40_000]"
  eval_data_split: "validation[:1000]"