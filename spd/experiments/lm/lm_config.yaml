# --- WandB ---
wandb_project: spd-lm
# wandb_project: null
wandb_run_name: "hist_test"
# wandb_run_name: null
wandb_run_name_prefix: ""

# --- General ---
seed: 0
C: 1000
n_mask_samples: 1
# n_ci_mlp_neurons: 16
target_module_patterns: ["transformer.h.3.mlp.c_fc"]

# Gate?
gate_config:
  gate_type: "mlp"  # "graph", "mlp",
  n_ci_mlp_neurons: 16
  # gate_type: "graph"  # "graph", "mlp",
  # d_subcomponent: 32
  # d_summary: 32
  # use_fast_graph: true  # Use GateGraphFast instead of GateGraph - only possible for simple star-graphs

# --- Loss Coefficients ---
# Weight faithfulness
faithfulness_coeff: 30.0
# faithfulness_coeff: 1
# faithfulness_scale: rms
faithfulness_scale: null


# Minimality
# importance_minimality_coeff: 1 # TODO 
importance_minimality_coeff: 3e-2
pnorm: 0.5
# pnorm: 2.0
# pnorm: 0.1
schatten_coeff: null
pannealing: false
# pannealing hyperparameters
# pannealing_start_value: 2.0
# pannealing_end_value: 0.5
# pannealing_warmup_fraction: 0.6
# pannealing_schedule_type: cosine
# Reconstruction
recon_coeff: null
# clamped_recon_coeff: 6e-1
clamped_recon_coeff: 1.0
filler_recon_coeff: null
stochastic_recon_coeff: 1.0
recon_layerwise_coeff: null
stochastic_recon_layerwise_coeff: null
all_components_recon_coeff: 1.0
# embedding_recon_coeff: 1
embedding_recon_coeff: null
is_embed_unembed_recon: false
output_loss_types:
  # kl:
  #   weight: 1.0
  # kl_top_k:
  #   weight: 1.0
  #   k: 5
  ce_diff:
    weight: 1.0
    
# --- Alternative to Stochastic ----
learned_filler_comp: False
# remove_dead_components: True
remove_dead_components: False
max_filler_scalar: 1.0
init_filler_comp_to_residual: False
# max_filler_scalar: 1.0

# --- Training ---
# batch_size: 4
batch_size: 64
# batch_size: 16
steps: 50_000 # TODO
# steps: 2000
lr: 1e-4
lr_schedule: constant
lr_warmup_pct: 0.03
lr_exponential_halflife: null
n_eval_steps: 100

# --- Logging & Saving ---
# image_freq: 200
# check_dead_components_freq: 200 # TODO
# print_freq: 200
image_on_first_step: true
image_freq: 5000
print_freq: 500
check_dead_components_freq: 5000
save_freq: null
log_ce_losses: False
noise_log_std: 0.2

# --- Pretrained model info ---
pretrained_model_class: transformers.AutoModelForCausalLM
pretrained_model_name_hf: roneneldan/TinyStories-1M
pretrained_model_output_attr: logits
preprocessor_name: EleutherAI/gpt-neo-125M

# --- Task Specific ---
task_config:
  task_name: lm
  max_seq_len: 64
  buffer_size: 1000
  dataset_name: "roneneldan/TinyStories"
  column_name: "text"
  # train_data_split: "train"
  # eval_data_split: "validation"
  # train_data_split: "train[:40_000]"
  train_data_split: "train[:100_000]"
  eval_data_split: "validation[:10_000]"